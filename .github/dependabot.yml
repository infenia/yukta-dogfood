version: 2
updates:
  - package-ecosystem: bun
    directories: ["/", "/channel"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
