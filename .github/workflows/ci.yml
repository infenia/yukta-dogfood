name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: cd channel && bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun check && bun check -p channel
      - run: bun test
      - run: cd channel && bun test
      # session.json and ticket-session.json are generated
      - run: bun src/heal/gen-session.ts --check
      - run: bun src/ticket/gen-ticket.ts --check
